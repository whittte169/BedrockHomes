[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-bedrock-homes"
version = "1.0.1"
description = "Lightweight and powerful home points system for your Minecraft server. This plugin provides a stable, seamless virtual currency system without any server lag."
dependencies = [
    "endstone>=0.11.0",
]

[project.entry-points."endstone"]
bedrock_homes = "endstone_bedrock_homes.main:Main"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_bedrock_homes"]
